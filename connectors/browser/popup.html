<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><span class="logo">&#11041;</span><b>DOCKLY</b><a id="unpair" href="#" hidden>Change pairing</a></header>

  <section id="main" hidden>
    <nav class="tabbar">
      <button class="tab on" data-pane="paneAdd">Add</button>
      <button class="tab" data-pane="paneTabs">Tabs</button>
      <button class="tab" data-pane="paneSites">Sites</button>
    </nav>

    <div id="paneAdd" class="pane">
      <div class="page">
        <input id="title" maxlength="120" placeholder="Title">
        <div id="url" class="url"></div>
        <div id="site" class="site" hidden></div>
      </div>
      <div id="newSite" hidden>
        <a id="makeSite" href="#"></a>
        <div id="siteForm" hidden>
          <input id="siteName" maxlength="40" placeholder="Site name">
          <select id="siteGroupBy">
            <option value="none">All links in one group</option>
            <option value="path">Group by first folder (owner)</option>
            <option value="subdomain">Group by subdomain</option>
          </select>
          <button id="createSite" class="primary">Create site</button>
        </div>
      </div>
      <div class="row2">
        <label>File under
          <select id="placement">
            <option value="">Automatic</option>
            <option value="__none__">No group</option>
          </select>
        </label>
        <label>Collection
          <select id="collection"><option value="">None</option></select>
        </label>
      </div>
      <div class="iconrow">
        <canvas id="preview" width="48" height="48"></canvas>
        <label>Icon
          <select id="iconMode">
            <option value="auto">Automatic (site icon)</option>
            <option value="tile">Colored letter tile</option>
            <option value="upload">Upload image&hellip;</option>
          </select>
        </label>
        <input id="color" type="color" value="#0891b2" title="Tile color" hidden>
        <input id="file" type="file" accept="image/*" hidden>
      </div>
      <button id="addPage" class="primary">Add this page</button>
    </div>

    <div id="paneTabs" class="pane" hidden>
      <button id="addTabs">Add all tabs in this window</button>
      <button id="pickTabs">Choose tabs&hellip;</button>
      <div id="tabList" hidden>
        <div id="tabs"></div>
        <button id="addSelected" class="primary">Add selected</button>
      </div>
    </div>

    <div id="paneSites" class="pane" hidden>
      <div id="mySites">
        <div id="siteTree"></div>
        <p id="noSites" class="empty" hidden>No sites yet. Make one from the Add tab.</p>
      </div>
    </div>
  </section>

  <section id="pair" hidden>
    <p>Paste the pairing code from <b>Dockly &rsaquo; Connectors</b>.</p>
    <input id="code" placeholder="47821.0123abcd...">
    <button id="save" class="primary">Pair</button>
  </section>

  <div id="status"></div>
  <script src="dockly.js"></script>
  <script src="popup.js"></script>
</body>
</html>
